events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 宣告 Docker 內網 DNS 解析器（防止服務未開機時 Nginx 直接崩潰）
    resolver 127.0.11 valid=10s;

    # 1. 主作品集網站
    server {
        listen 80;
        server_name shenyang.win www.shenyang.win portfolio.local;

        location / {
            set $target http://portfolio:3000;
            proxy_pass $target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 2. AI 平台網站 (已修正為連字號 ai-platform-frontend)
    server {
        listen 80;
        server_name ai-platform.shenyang.win ai-platform.local;

        location / {
            set $target http://ai-platform-frontend:3000;
            proxy_pass $target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            set $target http://ai-platform-backend:8000;
            proxy_pass $target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 3. AI 儀表板網站 (已修正為連字號 ai-dashboard-frontend)
    server {
        listen 80;
        server_name ai-dashboard.shenyang.win ai-dashboard.local;

        location / {
            set $target http://ai-dashboard-frontend:3000;
            proxy_pass $target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            set $target http://ai-dashboard-backend:8000;
            proxy_pass $target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}