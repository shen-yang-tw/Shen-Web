events {
    worker_connections 1024;
}

http {
    # 1. 主作品集網站
    server {
        listen 80;
        server_name shenyang.win www.shenyang.win;

        location / {
            proxy_pass http://portfolio:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # 2. AI 平台網站
    server {
        listen 80;
        server_name ai-platform.shenyang.win;

        # 如果有前端
        location / {
            proxy_pass http://ai-platform-frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 如果前端需要呼叫後端 API
        location /api/ {
            proxy_pass http://ai-platform-backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # 3. AI 儀表板網站
    server {
        listen 80;
        server_name ai-dashboard.shenyang.win;

        location / {
            proxy_pass http://ai-dashboard:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # location /api/ {
        #     proxy_pass http://ai_dashboard_backend:8000/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }
    }
}