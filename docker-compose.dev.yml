version: '3.8'

services:
  portfolio:
    build:
      context: ./portfolio
      dockerfile: Dockerfile.dev
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./portfolio:/app
      - /app/node_modules       # 👈 致命關鍵：保護容器內的 Linux 套件不被本機覆蓋
      - /app/.next
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0

  ai-platform-frontend:
    build:
      context: ./ai-platform/frontend
      dockerfile: Dockerfile.dev
    command: npm run dev
    ports:
      - "3001:3000"
    volumes:
      - ./ai-platform/frontend:/app
      - /app/node_modules       # 👈 致命關鍵
      - /app/.next
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0

  ai-platform-backend:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./ai-platform/backend:/app

  ai-dashboard-frontend:
    build:
      context: ./ai-dashboard/frontend
      dockerfile: Dockerfile.dev
    command: pnpm dev
    ports:
      - "3002:3000"
    volumes:
      - ./ai-dashboard/frontend:/app
      - /app/node_modules       # 👈 致命關鍵
      - /app/.next
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0

  ai-dashboard-backend:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"
    volumes:
      - ./ai-dashboard/backend:/app