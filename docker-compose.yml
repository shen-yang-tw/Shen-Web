networks:
  gateway-net:
    driver: bridge

volumes:
  ollama-data:
  nginx-logs:

services:
  # ---------------------------------------------------------------------------
  # 基礎設施：統一的 Nginx 閘道器
  # ---------------------------------------------------------------------------
  gateway:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    networks:
      - gateway-net

  # ---------------------------------------------------------------------------
  # 專案一：主作品集網站
  # ---------------------------------------------------------------------------
  portfolio:
    build:
      context: ./portfolio
    restart: unless-stopped
    env_file:
      - ./portfolio/.env
    networks:
      - gateway-net
    profiles: ["portfolio"]

  # ---------------------------------------------------------------------------
  # 專案二：AI 平台前端
  # ---------------------------------------------------------------------------
  ai-platform-frontend:
    build:
      context: ./ai-platform/frontend
    restart: unless-stopped
    env_file:
      - ./ai-platform/.env
    networks:
      - gateway-net
    profiles: ["ai-platform"]

  # 專案二：AI 平台後端
  ai-platform-backend:
    build:
      context: ./ai-platform/backend
    restart: unless-stopped
    env_file:
      - ./ai-platform/.env
    depends_on:
      - ollama  # 👈 確保 Ollama 先開機
    networks:
      - gateway-net
    profiles: ["ai-platform"]
# 🚀 加入這行：強制告訴 Linux Docker 把 host.docker.internal 對應到宿主機閘道
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------------------------------------------------------------------------
  # 專案三：AI 儀表板前端
  # ---------------------------------------------------------------------------
  ai-dashboard-frontend:
    build:
      context: ./ai-dashboard/frontend
    restart: unless-stopped
    env_file:
      - ./ai-dashboard/.env
    networks:
      - gateway-net
    profiles: ["ai-dashboard"]
    
  # 專案三：AI 儀表板後端
  ai-dashboard-backend:
    build:
      context: ./ai-dashboard/backend
    restart: unless-stopped
    env_file:
      - ./ai-dashboard/.env
    networks:
      - gateway-net
    profiles: ["ai-dashboard"]

  # ---------------------------------------------------------------------------
  # 基礎設施：Cloudflare Tunnel
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - gateway-net

  ollama:
    build:
      context: .
      dockerfile: docker/ollama/Dockerfile
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - gateway-net  # 👈 關鍵：必須跟後端在同一個網路，後端才找得到它！